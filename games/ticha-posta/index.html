<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0c7"><title>Tichá pošta obrázkem | Herní budka</title><link rel="stylesheet" href="ticha-posta.css?v=1"></head><body><main class="shell">
<header><a href="../../dalsi-budka/">← Zpět do druhé budky</a><h1>🤫 Tichá pošta obrázkem</h1><button id="newTop" class="soft">Nová hra</button></header>
<section id="setup" class="paper"><h2>Připravte poštu</h2><label>Počet hráčů <select id="playerCount"><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select></label><fieldset><legend>Jména hráčů</legend><div id="players"></div></fieldset><fieldset><legend>První zadání</legend><label class="radio"><input type="radio" name="promptMode" value="random" checked> Náhodné bezpečné zadání</label><label class="radio"><input type="radio" name="promptMode" value="custom"> Vlastní zadání</label><input id="customPrompt" maxlength="40" placeholder="Nejvýše 40 znaků" disabled></fieldset><p id="error" role="alert"></p><button id="start" class="primary">Spustit hru</button></section>
<section id="handoff" class="paper center" hidden><div class="big">📱</div><h2 id="handoffText">Předat zařízení hráči…</h2><p>Předchozí obsah je schovaný. Ostatní se nedívají.</p><button id="confirm" class="primary">Zařízení mám já</button></section>
<section id="secret" class="paper center" hidden><p class="eyebrow">Tajné zadání pro kreslíře</p><h2 id="secretText"></h2><button id="drawStart" class="primary">Jdu kreslit</button></section>
<section id="draw" hidden><div class="paper task"><span id="drawPlayer"></span><strong id="drawPrompt"></strong></div><div class="canvas-wrap"><canvas id="canvas" aria-label="Kreslicí plocha"></canvas></div><div class="paper tools"><div id="colors"></div><button data-width="4" class="tool selected">Tenká</button><button data-width="9" class="tool">Střední</button><button data-width="18" class="tool">Silná</button><button id="eraser" class="tool">Guma</button><button id="undo" class="tool">Zpět</button><button id="clear" class="tool">Vymazat</button></div><button id="saveDrawing" class="primary done">Hotovo – předat dál</button></section>
<section id="guess" class="paper center" hidden><p class="eyebrow" id="guessPlayer"></p><h2>Co je na obrázku?</h2><div class="preview"><canvas id="guessCanvas" aria-label="Kresba předchozího hráče"></canvas></div><label for="guessInput">Tvůj odhad</label><input id="guessInput" maxlength="40" autocomplete="off"><p id="guessError" role="alert"></p><button id="saveGuess" class="primary">Uložit odhad</button></section>
<section id="reveal" class="paper center" hidden><div class="big">🎉</div><h2>Jak se zpráva proměnila?</h2><div id="timeline" class="timeline"></div><button id="revealNext" class="primary">Odhalit první krok</button><button id="revealAll" class="soft">Ukázat vše</button><button id="again" class="soft">Hrát znovu</button></section>
</main><script src="data/prompts.js"></script><script src="data/themes.js"></script><script src="ticha-posta.js"></script></body></html>
