<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9f0a5"><title>Závod zvířátek | Herní budka</title><link rel="stylesheet" href="zavod-zviratek.css?v=1"></head><body><main class="shell">
<header><a href="../../dalsi-budka/">← Zpět do druhé budky</a><h1>🐾 Závod zvířátek</h1><button id="newTop" class="soft">Nová hra</button></header>
<section id="setup" class="panel"><h2>Připravte závodníky</h2><div class="settings"><label>Hráčů <select id="playerCount"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label><label>Trať <select id="track"><option value="short">Krátká</option><option value="medium" selected>Střední</option><option value="long">Dlouhá</option></select></label><label>Režim <select id="mode"><option value="normal">Normální</option><option value="fun" selected>Veselý</option></select></label></div><fieldset><legend>Hráči</legend><div id="players"></div></fieldset><p id="error" role="alert"></p><button id="start" class="primary">Odstartovat</button></section>
<section id="game" hidden><div class="panel turn"><div><span>Na tahu</span><strong id="turnName"></strong></div><button id="die" class="die" aria-label="Hodit kostkou">🎲<span id="dieValue">Hoď!</span></button><div><span>Pořadí v cíli</span><strong id="ranking">—</strong></div></div><div id="message" class="message" role="status"></div><div class="board"><svg id="trackSvg" viewBox="0 0 1000 620" role="img" aria-label="Klikatá závodní trať"></svg><div id="tokens"></div></div><button id="continue" class="primary continue" hidden>Pokračovat</button></section>
<section id="finish" class="panel center" hidden><div class="cup">🏆</div><h2>Všichni jsou v cíli!</h2><ol id="results"></ol><button id="again" class="primary">Hrát znovu</button><button id="settings" class="soft">Změnit nastavení</button></section>
</main><script src="data/events.js"></script><script src="data/themes.js"></script><script src="zavod-zviratek.js"></script></body></html>
