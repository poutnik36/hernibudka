<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f4ff"><title>Miniolympiáda | Herní budka</title><link rel="stylesheet" href="miniolympiada.css?v=1"></head><body><main class="shell">
<header><a href="../../dalsi-budka/">← Zpět do druhé budky</a><h1>🏅 Miniolympiáda</h1><button id="newTop" class="soft">Nová hra</button></header>
<section id="setup" class="panel"><h2>Přihláška na hry</h2><label>Počet hráčů <select id="playerCount"><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select></label><fieldset><legend>Jména závodníků</legend><div id="players"></div></fieldset><fieldset><legend>Disciplíny</legend><div id="disciplineList"></div></fieldset><p id="error" role="alert"></p><button id="start" class="primary">Zahájit olympiádu</button></section>
<section id="handoff" class="panel center" hidden><p id="disciplineProgress"></p><h2 id="handoffText"></h2><p>Výsledek předchozího hráče zůstává tajný.</p><button id="confirm" class="primary">Zařízení mám já</button></section>
<section id="play" hidden><article class="panel intro"><span id="currentPlayer"></span><h2 id="disciplineTitle"></h2><p id="instructions"></p></article><div id="stage" class="stage" aria-live="polite"></div></section>
<section id="saved" class="panel center" hidden><div class="big">✅</div><h2>Pokus uložen</h2><p>Výsledek ukážeme až po pokusu všech hráčů.</p><button id="continue" class="primary">Pokračovat</button></section>
<section id="disciplineResult" class="panel center" hidden><div class="big">🏅</div><h2 id="resultTitle"></h2><div id="resultTable"></div><button id="nextDiscipline" class="primary">Další disciplína</button></section>
<section id="finish" class="panel center" hidden><div class="big">🏆</div><h2>Celkové pořadí</h2><div id="finalTable"></div><button id="again" class="primary">Hrát znovu</button><button id="settings" class="soft">Změnit nastavení</button></section>
</main><script>window.MiniDisciplines=[];</script><script src="disciplines/stopky.js"></script><script src="disciplines/rychle-kliky.js"></script><script src="disciplines/pamet.js"></script><script src="disciplines/terc.js"></script><script src="disciplines/odhad.js"></script><script src="disciplines/cisla.js"></script><script src="disciplines/hvezdy.js"></script><script src="disciplines/slova.js"></script><script src="data/themes.js"></script><script src="miniolympiada.js"></script></body></html>
