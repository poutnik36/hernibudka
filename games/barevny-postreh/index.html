<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#11172d"><title>Barevný postřeh | Herní budka</title><link rel="stylesheet" href="barevny-postreh.css?v=1"></head><body><main>
<section id="setup" class="setup card"><a href="../../dalsi-budka/">← Zpět do druhé budky</a><h1>🌈 Barevný postřeh</h1><p>Tři nebo čtyři hráči se posadí každý ke své straně zařízení.</p><div class="settings"><label>Počet hráčů <select id="playerCount"><option value="3">3 hráči</option><option value="4" selected>4 hráči</option></select></label><label>Režim <select id="mode"><option value="symbol">Vlastní symbol</option><option value="color">Shodná barva</option><option value="combo">Symbol + barva</option><option value="opposite">Opačné pravidlo (těžké)</option></select></label><label>Délka <select id="length"><option value="20">20 výzev</option><option value="40" selected>40 výzev</option><option value="60">60 výzev</option><option value="first10">První na 10 bodů</option></select></label></div><fieldset><legend>Hráči u zařízení</legend><div id="editors"></div></fieldset><button id="start" class="primary">Spustit arénu</button></section>
<section id="arena" hidden aria-label="Herní plocha pro tři nebo čtyři hráče"><button class="zone z0" data-player="0"></button><button class="zone z1" data-player="1"></button><button class="zone z2" data-player="2"></button><button class="zone z3" data-player="3"></button><div class="center"><div id="progress"></div><div id="signal" aria-live="assertive">Připravte se</div><div id="rule"></div></div><button id="quit" class="quit">Nová hra</button></section>
<section id="finish" class="card finish" hidden><div class="cup">🏆</div><h1>Výsledky postřehu</h1><div id="results"></div><button id="again" class="primary">Hrát znovu</button><button id="settings" class="soft">Změnit nastavení</button></section>
</main><script src="data/themes.js"></script><script src="barevny-postreh.js"></script></body></html>
