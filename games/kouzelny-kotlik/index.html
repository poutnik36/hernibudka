<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25133f"><title>Kouzelný kotlík | Herní budka</title><link rel="stylesheet" href="kouzelny-kotlik.css?v=1"></head><body><main class="shell">
<header><a href="../../dalsi-budka/">← Zpět do druhé budky</a><h1>🪄 Kouzelný kotlík</h1><button id="newTop" class="soft">Nová hra</button></header>
<section id="setup" class="panel"><h2>Namíchejte pravidla</h2><div class="settings"><label>Hráčů <select id="playerCount"><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select></label><label>Režim <select id="mode"><option value="shared">Společná řada</option><option value="generated">Hra generuje řadu</option></select></label><label>Životy <select id="lives"><option>1</option><option selected>2</option><option>3</option></select></label><label>Rychlost ukázky <select id="speed"><option value="350">Rychlá</option><option value="650" selected>Normální</option><option value="1000">Pomalá</option></select></label><label>Sada přísad <select id="set"></select></label><label>Maximum řady <select id="limit"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></label></div><fieldset><legend>Jména hráčů</legend><div id="players"></div></fieldset><button id="start" class="primary">Zapálit kotlík</button></section>
<section id="handoff" class="panel center" hidden><div class="big">📱</div><h2 id="handoffText"></h2><p>Řada je schovaná, dokud zařízení nepřevezme správný hráč.</p><button id="confirm" class="primary">Zařízení mám já</button></section>
<section id="game" hidden><div class="status panel"><div><span>Na tahu</span><strong id="turnName"></strong></div><div><span>Délka řady</span><strong id="length"></strong></div><div id="livesStatus"></div></div><div class="cauldron"><div id="cauldronIcon">🫕</div><div id="display" aria-live="polite">Připrav se…</div></div><p id="instruction" class="instruction"></p><div id="ingredients" class="ingredients"></div></section>
<section id="result" class="panel center" hidden><h2 id="resultTitle"></h2><p id="resultText"></p><button id="next" class="primary">Další hráč</button></section>
<section id="finish" class="panel center" hidden><div class="big">🏆</div><h2>Kouzlo je hotové!</h2><div id="final"></div><button id="again" class="primary">Hrát znovu</button><button id="settings" class="soft">Změnit nastavení</button></section>
</main><script src="data/ingredients.js"></script><script src="data/themes.js"></script><script src="kouzelny-kotlik.js"></script></body></html>
