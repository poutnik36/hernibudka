<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bde9f4"><title>Poklad na ostrově | Herní budka</title><link rel="stylesheet" href="poklad-na-ostrove.css?v=1"></head><body><main class="shell">
<header><a href="../../dalsi-budka/">← Zpět do druhé budky</a><h1>🏝️ Poklad na ostrově</h1><button id="newTop" class="soft">Nová hra</button></header>
<section id="setup" class="panel"><h2>Sestavte výpravu</h2><div class="settings"><label>Hráčů <select id="playerCount"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label><label>Délka hry <select id="rounds"><option value="12">Krátká – 12 kol</option><option value="20" selected>Běžná – 20 kol</option><option value="30">Dlouhá – 30 kol</option></select></label></div><fieldset><legend>Dobrodruzi</legend><div id="players"></div></fieldset><p id="error" role="alert"></p><button id="start" class="primary">Vyplout</button></section>
<section id="game" hidden><div class="panel status"><div><span>Kolo</span><strong id="round"></strong></div><div><span>Na tahu</span><strong id="turn"></strong></div><div><span>Kroky</span><strong id="steps"></strong></div><div id="inventory"></div></div><div id="message" class="message" role="status"></div><div class="map-wrap"><div id="map" class="map" role="grid" aria-label="Mapa ostrova 9 krát 9"></div><div id="tokens"></div></div><div class="actions"><button id="endTurn" class="primary">Ukončit tah</button></div></section>
<section id="finish" class="panel center" hidden><div class="big">🏆</div><h2>Výprava skončila</h2><div id="results"></div><button id="again" class="primary">Hrát znovu</button><button id="settings" class="soft">Změnit nastavení</button></section>
</main><script src="data/maps.js"></script><script src="data/events.js"></script><script src="data/treasures.js"></script><script src="data/themes.js"></script><script src="poklad-na-ostrove.js"></script></body></html>
